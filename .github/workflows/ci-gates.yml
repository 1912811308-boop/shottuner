# ⚠️ 硬规则一：CI 一律不签名 —— 签名在设备端用 SideStore 侧载时完成。
# ⚠️ 硬规则二：Apple ID / 证书 / provisioning profile 绝不进本仓库的 secrets，也绝不入库。
# ⚠️ 硬规则三：若将来 CI 要直出可安装包，必须用 App Store Connect API Key，
#              不得使用 `-allowProvisioningUpdates` 搭配 Apple ID —— 出现该配置评审直接打回。
#
# 为什么这三条要写成注释而不是只写进文档：
#   凭据一旦入库，CI 才有能力用它。README 里写"不进 secrets"只是**承诺**，
#   承诺会被人绕过，机器不会。真正的保障是 tools/ci/check-apple-credentials.sh。
name: ci-gates

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  gates:
    name: 零网络 / 凭据 / 门禁自检
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 门禁自己先被测一遍：注入「应该绿」的东西必须绿，注入「应该红」的东西必须红。
      # 这一步放在最前面 —— 它抓到过 common.sh 里一个让门禁永远绿的 bug。
      - name: 门禁反向验证
        run: bash tools/ci/test-gates.sh

      - name: L1 源码层零网络
        run: bash tools/ci/check-no-network.sh

      - name: L2 配置层零网络
        run: bash tools/ci/check-no-network-config.sh

      - name: G1-d Apple 凭据门禁
        run: bash tools/ci/check-apple-credentials.sh

      # commonMain 纯度扫描（秒级）：Android 编译看不出来、iOS 上会挂的 JVM-only 用法。
      # 权威检查是 common-gate 里的 compileCommonMainKotlinMetadata；这一道是快速反馈。
      - name: commonMain 纯度扫描
        run: bash tools/ci/check-common-purity.sh

  # ── common-gate：commonMain 能编 iOS target 吗？（整份 CI 设计的单点依赖）──
  #
  # ★ 为什么跑在 Linux runner 上：
  #   免费私有仓库的 macOS 配额只有约 200 分钟/月，而 macOS 是 10× 倍率。
  #   所以 Linux 这一档只做**不依赖 Apple 工具链**的事：
  #   ① common 源集的 metadata 编译（验证「只用了 common API」）
  #   ② commonTest + Android 单测
  #   ③ Android 侧编译
  #
  # ★ 2026-10-27 实测结论（架构侧「悬置项 S1」已翻盘）：
  #   `:shared:compileKotlinIosSimulatorArm64` 在 **Linux runner 上是 SKIPPED** ——
  #   Kotlin/Native 的硬宿主限制：**Apple 目标只能从 macOS 宿主编译**。
  #   ⚠️ Gradle 的 SKIPPED 任务，GitHub 上显示的 conclusion 也是 success！
  #      只看结论会误判成「通过」—— 必须去日志里确认任务不是 SKIPPED。
  #   所以 iOS 编译挪到下面的 `ios-compile` job（macOS，手动触发）。
  #
  # ★ `-PenableAppleTargets=true`：
  #   Apple 目标默认关闭（否则 Windows 开发者改一行 commonMain 也得下载
  #   几百 MB 的 Kotlin/Native 预编译，而那个包在 Windows 上根本用不上）。
  common-gate:
    name: commonMain 编译 + 单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # ★ gradlew 的可执行位：Windows 上 git 的 core.fileMode 默认 false，
      #   本地文件看着有执行位，但**提交进仓库的模式可能是 644** ——
      #   checkout 到 Linux runner 上就没有执行权限，./gradlew 直接
      #   "Permission denied"（exit 126）。这一步当年就是这么翻车的。
      - name: 准备 gradle.properties
        run: cp gradle.properties.example gradle.properties

      - name: 确保 gradlew 可执行
        run: chmod +x gradlew

      # gradle.properties 被 .gitignore 排除（里面有明文签名口令），
      # 但其中的构建必需项（android.useAndroidX 等）CI 也要用 ——
      # 所以从 example 复制一份。example 里的 RELEASE_* 是空的，
      # 而签名配置已改成惰性求值（app/build.gradle.kts），
      # 所以**门禁与 debug 构建都不需要凭据**，只有 assembleRelease 才需要。
      # ── 1. common 源集的 metadata 编译：验证「只用了 common API」──
      #   这是 Linux 上能做的「iOS 纯度」代理检查：
      #   metadata 编译只允许 common API。若 commonMain 里用了
      #   Android/JVM-only 的东西（如 java.lang.Math、java.text.SimpleDateFormat），
      #   这里会报错 —— 而 **Android 侧编译看不出来**（Android 有这些类）。
      #   ★ 跑完必须确认这行**不是 SKIPPED**（多目标配置下才有意义），
      #     所以下面显式做了一次反 SKIPPED 断言。
      - name: 编译 common 源集 metadata
        run: |
          set -o pipefail
          ./gradlew :shared:compileCommonMainKotlinMetadata -PenableAppleTargets=true --console=plain 2>&1 | tee /tmp/meta.log
          if grep -q "compileCommonMainKotlinMetadata SKIPPED" /tmp/meta.log; then
            echo "::error::common metadata 编译被 SKIPPED —— 这一档没有真的在验证 common 纯度"
            exit 1
          fi

      # ── 2. commonTest + Android 单测（JVM 上跑，不需要 macOS）──
      - name: 单元测试
        run: ./gradlew :shared:testDebugUnitTest :app:testDebugUnitTest

      # ── 3. Android 侧零行为变化 ──
      - name: 编译 Android
        run: ./gradlew :app:assembleDebug

  # ── ios-compile：真正把 iOS target 编出来（**必须 macOS 宿主**）────────
  #
  # ★ 为什么单独一个 job 且**手动触发**：
  #   Kotlin/Native 的硬宿主限制 —— Apple 目标只能从 macOS 宿主编译，
  #   在 Linux 上该任务是 SKIPPED（实测 2026-10-27）。
  #   而免费私有仓库的 macOS 配额只有约 200 分钟/月（10× 倍率后约 20 次热构建），
  #   **不能每次 push 都烧**。所以改成 workflow_dispatch 手动触发：
  #   攒一批改动再编一次，而不是改一行编一次。
  #
  # ★ 关键：SideStore 的 7 天重签**不需要重新编译** —— 重签的是同一个 ipa。
  #   所以 macOS 配额只花在「代码变更后的重新编译」上，不花在 7 天重签上。
  #
  # ★ 这个 job 跑的是「模拟器」target（iosSimulatorArm64），
  #   它验证的是**源码能在 iOS 侧编译**；真机产物（iosArm64 + framework 链接）
  #   由 G4 出包 job 在 macOS 上做。
  ios-compile:
    name: iOS target 编译（macOS · 手动触发）
    runs-on: macos-latest
    # 只手动触发 + 允许手动跑分档；不做 push 触发 —— 保护 macOS 配额
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: 准备 gradle.properties
        run: cp gradle.properties.example gradle.properties

      - name: 确保 gradlew 可执行
        run: chmod +x gradlew

      - name: 编译 iOS target（模拟器 + 真机）
        run: |
          set -o pipefail
          ./gradlew :shared:compileKotlinIosSimulatorArm64 :shared:compileKotlinIosArm64             -PenableAppleTargets=true --console=plain 2>&1 | tee /tmp/ios.log
          # ★ 反 SKIPPED 断言：在 macOS 上如果还是 SKIPPED，说明开关没生效 ——
          #   那就等于什么都没验，必须让它红。
          if grep -qE "compileKotlinIos(Simulator)?Arm64 SKIPPED" /tmp/ios.log; then
            echo "::error::iOS 编译被 SKIPPED —— 什么都没验，必须让它红"
            exit 1
          fi
