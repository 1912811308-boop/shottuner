# ⚠️ 硬规则一：CI 一律不签名 —— 签名在设备端用 SideStore 侧载时完成。
# ⚠️ 硬规则二：Apple ID / 证书 / provisioning profile 绝不进本仓库的 secrets，也绝不入库。
# ⚠️ 硬规则三：若将来 CI 要直出可安装包，必须用 App Store Connect API Key，
#              不得使用 `-allowProvisioningUpdates` 搭配 Apple ID —— 出现该配置评审直接打回。
#
# 为什么这三条要写成注释而不是只写进文档：
#   凭据一旦入库，CI 才有能力用它。README 里写"不进 secrets"只是**承诺**，
#   承诺会被人绕过，机器不会。真正的保障是 tools/ci/check-apple-credentials.sh。
name: ci-gates

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  gates:
    name: 零网络 / 凭据 / 门禁自检
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 门禁自己先被测一遍：注入「应该绿」的东西必须绿，注入「应该红」的东西必须红。
      # 这一步放在最前面 —— 它抓到过 common.sh 里一个让门禁永远绿的 bug。
      - name: 门禁反向验证
        run: bash tools/ci/test-gates.sh

      - name: L1 源码层零网络
        run: bash tools/ci/check-no-network.sh

      - name: L2 配置层零网络
        run: bash tools/ci/check-no-network-config.sh

      - name: G1-d Apple 凭据门禁
        run: bash tools/ci/check-apple-credentials.sh

      # commonMain 纯度扫描（秒级）：Android 编译看不出来、iOS 上会挂的 JVM-only 用法。
      # 权威检查是 common-gate 里的 compileCommonMainKotlinMetadata；这一道是快速反馈。
      - name: commonMain 纯度扫描
        run: bash tools/ci/check-common-purity.sh

      # iOS 工程规格自检：project.yml / Info.plist 是纯文本，
      # 没有 Mac 也能改 —— 所以必须有机器替人盯着那些硬规则
      # （部署目标、签名开关、零第三方依赖、ATS 不放宽、权限清单、只有一个 target）。
      # 只需要读文本，Linux runner 就够，不占 macOS 配额。
      - name: iOS 工程规格自检
        run: bash tools/ci/check-ios-project-spec.sh

  # ── common-gate：commonMain 能编 iOS target 吗？（整份 CI 设计的单点依赖）──
  #
  # ★ 为什么跑在 Linux runner 上：
  #   免费私有仓库的 macOS 配额只有约 200 分钟/月，而 macOS 是 10× 倍率。
  #   所以 Linux 这一档只做**不依赖 Apple 工具链**的事：
  #   ① common 源集的 metadata 编译（验证「只用了 common API」）
  #   ② commonTest + Android 单测
  #   ③ Android 侧编译
  #
  # ★ 2026-10-27 实测结论（架构侧「悬置项 S1」已翻盘）：
  #   `:shared:compileKotlinIosSimulatorArm64` 在 **Linux runner 上是 SKIPPED** ——
  #   Kotlin/Native 的硬宿主限制：**Apple 目标只能从 macOS 宿主编译**。
  #   ⚠️ Gradle 的 SKIPPED 任务，GitHub 上显示的 conclusion 也是 success！
  #      只看结论会误判成「通过」—— 必须去日志里确认任务不是 SKIPPED。
  #   所以 iOS 编译挪到下面的 `ios-compile` job（macOS，手动触发）。
  #
  # ★ `-PenableAppleTargets=true`：
  #   Apple 目标默认关闭（否则 Windows 开发者改一行 commonMain 也得下载
  #   几百 MB 的 Kotlin/Native 预编译，而那个包在 Windows 上根本用不上）。
  common-gate:
    name: commonMain 编译 + 单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # ★ gradlew 的可执行位：Windows 上 git 的 core.fileMode 默认 false，
      #   本地文件看着有执行位，但**提交进仓库的模式可能是 644** ——
      #   checkout 到 Linux runner 上就没有执行权限，./gradlew 直接
      #   "Permission denied"（exit 126）。这一步当年就是这么翻车的。
      - name: 准备 gradle.properties
        run: cp gradle.properties.example gradle.properties

      - name: 确保 gradlew 可执行
        run: chmod +x gradlew

      # gradle.properties 被 .gitignore 排除（里面有明文签名口令），
      # 但其中的构建必需项（android.useAndroidX 等）CI 也要用 ——
      # 所以从 example 复制一份。example 里的 RELEASE_* 是空的，
      # 而签名配置已改成惰性求值（app/build.gradle.kts），
      # 所以**门禁与 debug 构建都不需要凭据**，只有 assembleRelease 才需要。
      # ── 1. common 源集的 metadata 编译：验证「只用了 common API」──
      #   这是 Linux 上能做的「iOS 纯度」代理检查：
      #   metadata 编译只允许 common API。若 commonMain 里用了
      #   Android/JVM-only 的东西（如 java.lang.Math、java.text.SimpleDateFormat），
      #   这里会报错 —— 而 **Android 侧编译看不出来**（Android 有这些类）。
      #   ★ 跑完必须确认这行**不是 SKIPPED**（多目标配置下才有意义），
      #     所以下面显式做了一次反 SKIPPED 断言。
      - name: 编译 common 源集 metadata
        run: |
          set -o pipefail
          ./gradlew :shared:compileCommonMainKotlinMetadata -PenableAppleTargets=true --console=plain 2>&1 | tee /tmp/meta.log
          if grep -q "compileCommonMainKotlinMetadata SKIPPED" /tmp/meta.log; then
            echo "::error::common metadata 编译被 SKIPPED —— 这一档没有真的在验证 common 纯度"
            exit 1
          fi

      # ── 2. commonTest + Android 单测（JVM 上跑，不需要 macOS）──
      - name: 单元测试
        run: ./gradlew :shared:testDebugUnitTest :app:testDebugUnitTest

      # ── 3. Android 侧零行为变化 ──
      - name: 编译 Android
        run: ./gradlew :app:assembleDebug

  # ── ios-compile：真正把 iOS target 编出来（**必须 macOS 宿主**）────────
  #
  # ★ 为什么单独一个 job 且**手动触发**：
  #   Kotlin/Native 的硬宿主限制 —— Apple 目标只能从 macOS 宿主编译，
  #   在 Linux 上该任务是 SKIPPED（实测 2026-10-27）。
  #   而免费私有仓库的 macOS 配额只有约 200 分钟/月（10× 倍率后约 20 次热构建），
  #   **不能每次 push 都烧**。所以改成 workflow_dispatch 手动触发：
  #   攒一批改动再编一次，而不是改一行编一次。
  #
  # ★ 关键：SideStore 的 7 天重签**不需要重新编译** —— 重签的是同一个 ipa。
  #   所以 macOS 配额只花在「代码变更后的重新编译」上，不花在 7 天重签上。
  #
  # ★ 这个 job 跑的是「模拟器」target（iosSimulatorArm64），
  #   它验证的是**源码能在 iOS 侧编译**；真机产物（iosArm64 + framework 链接）
  #   由 G4 出包 job 在 macOS 上做。
  ios-compile:
    name: iOS target 编译（macOS · 手动触发）
    # ★ 为什么不用 macos-latest：
    #   实测 2026-10-27，免费私有仓库的 macOS runner **排队 15 分钟就被自动取消**
    #   （GitHub 在分配不到 runner 时会 cancel 并报 failure）。
    #   ★ 2026-11-09 查到**真正的原因**（不是排队，也不是私有/公开）：
    #     两个 macOS job 的 check-run annotation 写的是
    #       `The configuration 'macos-14-arm64-us-default' is not supported`
    #     —— `macos-14` 现在解析成 **arm64** 配置，这个账号档位不支持它，
    #     于是 job 在 0 个 step 时就被 cancel（连 runner 都没分到）。
    #   ⇒ 改成 `macos-13`：那是 Intel 镜像，标签本身不含 arm64 变体。
    #     设备包要的是 `-arch arm64`，**Intel 机器可以交叉编译**，不影响产物架构。
    runs-on: macos-13
    # 排队 + 编译的总时限；超了就明确失败，别让人以为跑过
    timeout-minutes: 45
    # 只手动触发 + 允许手动跑分档；不做 push 触发 —— 保护 macOS 配额
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: 准备 gradle.properties
        run: cp gradle.properties.example gradle.properties

      - name: 确保 gradlew 可执行
        run: chmod +x gradlew

      - name: 编译 iOS target（模拟器 + 真机）
        run: |
          set -o pipefail
          ./gradlew :shared:compileKotlinIosSimulatorArm64 :shared:compileKotlinIosArm64             -PenableAppleTargets=true --console=plain 2>&1 | tee /tmp/ios.log
          # ★ 反 SKIPPED 断言：在 macOS 上如果还是 SKIPPED，说明开关没生效 ——
          #   那就等于什么都没验，必须让它红。
          if grep -qE "compileKotlinIos(Simulator)?Arm64 SKIPPED" /tmp/ios.log; then
            echo "::error::iOS 编译被 SKIPPED —— 什么都没验，必须让它红"
            exit 1
          fi

      # ── T10：真正把 iOS 工程编出来（xcodegen generate + xcodebuild）──
      #
      # ★ 为什么必须有这一步：
      #   上面那个 gradle 步骤只证明「Kotlin 侧能编出 iOS 的 klib」，
      #   **完全没有验证 Xcode 工程本身**（SwiftUI 代码能不能编、
      #   project.yml 能不能生成出工程、共享内核的 framework 能不能链上）。
      #   ios/project.yml + ios/ShotTuner/**.swift 是纯文本，Windows 上也能改 ——
      #   那就更需要一个机器来兜底，否则「改了但编不过」会一路漏到出包那一步。
      #
      # ★ 为什么装 XcodeGen 用「brew 优先 + release 二进制兜底」：
      #   brew 装 XcodeGen 一般只要几十秒，但它依赖 Homebrew 的索引状态，
      #   偶尔会卡住或限流。**不能因为装不上就跳过这一步** —— 跳过就等于没验。
      #   所以兜底路径是：从 GitHub Releases 直接拉官方 zip（几 MB，秒级）。
      - name: 安装 XcodeGen
        run: |
          set -uo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then
            if brew install xcodegen; then
              echo "brew 安装成功"
            else
              echo "::warning::brew install xcodegen 失败 → 回退到 GitHub Releases 的官方二进制"
              ZIP_URL="$(curl -fsSL https://api.github.com/repos/yonaskolb/XcodeGen/releases/latest \
                | grep -o 'https://[^"]*xcodegen\.zip' | head -1)"
              [ -n "${ZIP_URL}" ] || { echo "::error::拿不到 XcodeGen 的下载地址"; exit 1; }
              echo "下载：${ZIP_URL}"
              curl -fsSL -o /tmp/xcodegen.zip "${ZIP_URL}"
              rm -rf /tmp/xcodegen && mkdir -p /tmp/xcodegen
              unzip -q /tmp/xcodegen.zip -d /tmp/xcodegen
              sudo install -m 0755 /tmp/xcodegen/bin/xcodegen /usr/local/bin/xcodegen
            fi
          fi
          xcodegen --version
          # ★ 版本断言：projectFormat 选项是 XcodeGen **2.45.0** 才加的。
          #   版本太旧 → project.yml 里的 projectFormat 被忽略 → 生成 objectVersion 77
          #   → runner 上的 Xcode 15.4 打不开 → 门禁永远红，
          #   而那个报错看起来像「工程文件坏了」，排查成本极高。
          VER="$(xcodegen --version | grep -oE '[0-9]+\.[0-9]+' | head -1)"
          MAJ="${VER%%.*}"
          MIN="$(printf '%s' "${VER}" | cut -d. -f2)"
          if [ -z "${MAJ}" ] || [ -z "${MIN}" ] || [ "${MAJ}" -lt 2 ] || { [ "${MAJ}" -eq 2 ] && [ "${MIN}" -lt 45 ]; }; then
            echo "::error::XcodeGen 版本过低（${VER:-未知}）—— projectFormat 选项需要 >= 2.45"
            exit 1
          fi
          echo "XcodeGen 版本 OK：${VER}"

      - name: 记录 Xcode 版本
        run: |
          set -euo pipefail
          xcodebuild -version
          xcode-select -p

      - name: 生成 Xcode 工程（xcodegen generate）
        run: |
          set -euo pipefail
          xcodegen generate --spec ios/project.yml --project ios
          # 反「没真生成」断言：工程目录必须存在
          test -d ios/ShotTuner.xcodeproj || { echo "::error::xcodegen 没有生成 .xcodeproj"; exit 1; }
          echo "::notice::xcodegen generate 完成"

      - name: 编译 iOS App（xcodebuild · 模拟器 · 不签名）
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/ShotTuner.xcodeproj \
            -scheme ShotTuner \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee /tmp/xcodebuild.log
          # ★ 反 SKIPPED / 反「什么都没编」断言：
          #   xcodebuild 成功但一个源文件都没编（工程生成坏了）也等于没验。
          grep -q "KMP_FRAMEWORK_READY=1" /tmp/xcodebuild.log \
            || { echo "::error::KMP 共享内核的 framework 没有产出 —— Run Script 没跑或跑失败了"; exit 1; }
          grep -q "SwiftCompile\|CompileSwiftSources" /tmp/xcodebuild.log \
            || { echo "::error::没有看到 Swift 编译记录 —— 工程可能没真正编译"; exit 1; }
          grep -q "BUILD SUCCEEDED" /tmp/xcodebuild.log \
            || { echo "::error::xcodebuild 没有 BUILD SUCCEEDED"; exit 1; }
          echo "::notice::xcodebuild 编译通过"

      - name: 产物留档（.app 目录清单）
        run: |
          set -euo pipefail
          APP=$(find ios/build/DerivedData -maxdepth 5 -name 'ShotTuner.app' -type d | head -1)
          if [ -z "${APP}" ]; then
            echo "::error::找不到构建出来的 ShotTuner.app"
            exit 1
          fi
          echo "产物：${APP}"
          ls -la "${APP}"
          # 共享内核的 framework 必须被嵌进去（动态 framework 少了它，真机装上去会崩）
          test -d "${APP}/Frameworks/Shared.framework" \
            || { echo "::error::产物里没有 Frameworks/Shared.framework"; exit 1; }

  # ── ios-package：产出**真机可装**的未签名 ipa（**必须 macOS 宿主**）────────
  #
  # ★ 为什么这个 job 存在：
  #   ios-compile 产出的是**模拟器** .app（iosSimulatorArm64 切片）——
  #   它证明「源码能在 iOS 侧编译」，但**装不到 iPhone 上**（模拟器架构 ≠ 真机架构）。
  #   本 job 走 iphoneos 目标（arm64 真机架构），产出 SideStore 能签的 ipa。
  #
  # ★ 为什么「未签名 ipa」就够了：
  #   侧载链路是 **SideStore + 免费个人 Apple ID（7 天重签）**——
  #   **签名动作发生在 iPhone 上**，CI 只负责把二进制打包好。
  #   于是两条硬规则自然成立：CI 一律不签名（硬规则一）、Apple 凭据绝不进 secrets（硬规则二）。
  #   ⇒ 本 job 里没有任何签名动作，也没有任何凭据。
  #
  # ★ 为什么手动触发：
  #   免费私有仓库的 macOS 配额约 200 分钟/月。
  #   workflow_dispatch 会触发**整个工作流**里的所有 job（包括 ios-compile），
  #   所以点一次 = 两份 macOS 占用 —— 攒着跑，不要每次 push 都点。
  ios-package:
    name: iOS 出包（macOS · 手动触发）
    # ★ 与 ios-compile 同款 runner。`macos-14` 解析成 arm64 配置，
    #   这个账号档位不支持（annotation 原文：`...'macos-14-arm64-us-default' is not supported`），
    #   会在 0 个 step 时被 cancel。改 `macos-13`（Intel），交叉编译出 arm64 设备包。
    runs-on: macos-13
    timeout-minutes: 60
    if: github.event_name == 'workflow_dispatch'
    # ★ 需要 contents: write：把 ipa 挂到 v1.0.0 这个 Release 上（与 Android 的 apk 同一个）。
    permissions:
      contents: write
    # ★ 同一个出包 job 不允许并发跑 —— macOS 配额 precious，误触两次就烧两份。
    concurrency:
      group: ios-package-macos
      cancel-in-progress: false
    env:
      # ★ 按 **tag** 查 Release，不写死 release id。
      #   之前写死 `RELEASE_ID: "427906078"`（v1.0.0），每发一个新版本就得改一次；
      #   忘了改就会把 ipa 挂到旧 Release 上，而且 API 不会报错（旧 Release 还在），
      #   **静默挂错**比 404 更难发现。
      #   ⇒ 改成按 tag 查：发新版本时只需改这一行 tag，release id 由 API 现场解析。
      # ★ 这一行必须与 `ios/project.yml` 的 `MARKETING_VERSION` 保持同步。
      #   1.1.0 起有机器保障：本 job 的 `版本同源 · RELEASE_TAG 与 MARKETING_VERSION`
      #   这个 step 会比对两者，不一致直接红 —— 不再靠人记。
      RELEASE_TAG: "v1.1.0"
    steps:
      # ★ 前置检查：Release 必须**先**存在，否则本 job 会白烧约 20 分钟 macOS 配额。
      #
      #   为什么需要它：最后一步用 `/releases/tags/<tag>` 端点取 upload_url，
      #   而 `curl -f` 遇 404 直接失败 ⇒ `set -e` 让 step 退出 ⇒ 整个 job 红。
      #   问题是这一步在**归档 + 打包 + 12 条反假绿断言全部跑完之后**才执行，
      #   也就是说「Release 忘了建」这个纯粹的手工疏漏，要烧掉 20 分钟才暴露。
      #   把它提到最前面，20 分钟变成 5 秒。
      #
      #   ★ 为什么放在 `ios-package` 里而不是另开一个 ubuntu 前置 job：
      #     另开 job 就得再写一遍 tag 字面量，而本文件上方刚说过
      #     「tag 写死容易静默挂错」。放在 job 内可以直接复用 `${RELEASE_TAG}`，
      #     只有一个真出处。
      - name: 前置检查 · Release 是否存在
        # ★ `GITHUB_TOKEN` 不是自动注入的环境变量，必须显式给。
        #   本文件其它用到它的地方也是逐个 step 自己给的（见最后的上传步骤），
        #   所以这里同样显式声明，不要指望 job 级 env 里已经有。
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          CODE="$(curl -sS -o /tmp/rel.json -w '%{http_code}' \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${API}/releases/tags/${RELEASE_TAG}")"
          if [ "${CODE}" != "200" ]; then
            echo "::error::Release ${RELEASE_TAG} 不存在（HTTP ${CODE}）—— 请先在网页上建好 Release，否则后面的 ipa 无处可挂"
            echo "         https://github.com/${GITHUB_REPOSITORY}/releases/new?tag=${RELEASE_TAG}"
            exit 1
          fi
          echo "::notice::Release ${RELEASE_TAG} 已存在，可以出包"

      - uses: actions/checkout@v4

      # ★ 机器保障：`RELEASE_TAG` 与 `ios/project.yml` 的 `MARKETING_VERSION` 必须一致。
      #
      #   为什么需要它：这两个值一处在 workflow 的 `env`、一处在工程规格里，
      #   改版本号时**很容易只改一处**。只改 project.yml 的后果是：
      #   CI 把 1.1.0 的 ipa 挂到 v1.0.1 的 Release 上 —— API 不报错（旧 Release 还在），
      #   产物名与 tag 对不上，而**没有任何一步会红**。
      #   本文件里「tag 写死容易静默挂错」这句话已经出现过两次，一直靠人守；
      #   这次把它变成构建失败。解析写法与下面「出 ipa」那步**逐字一致**，
      #   避免两个地方对同一份 YAML 用两套正则。
      - name: 版本同源 · RELEASE_TAG 与 MARKETING_VERSION
        run: |
          set -euo pipefail
          MV="$(grep -E "^[[:space:]]*MARKETING_VERSION[[:space:]]*:" ios/project.yml | head -1 \
            | sed -E 's/.*:[[:space:]]*//' | tr -d '"' | tr -d '[:space:]')"
          [ -n "${MV}" ] || { echo "::error::从 ios/project.yml 里读不出 MARKETING_VERSION"; exit 1; }
          if [ "v${MV}" != "${RELEASE_TAG}" ]; then
            echo "::error::版本不同源：ios/project.yml 的 MARKETING_VERSION = ${MV}，而 ci-gates.yml 的 RELEASE_TAG = ${RELEASE_TAG}"
            echo "         两者必须一致，否则 ipa 会被挂到旧 Release 上，而且不会报错。"
            echo "         把 RELEASE_TAG 改成 v${MV}（或反过来改 project.yml）。"
            exit 1
          fi
          echo "::notice::版本同源：MARKETING_VERSION=${MV} / RELEASE_TAG=${RELEASE_TAG}"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: 准备 gradle.properties
        run: cp gradle.properties.example gradle.properties

      - name: 确保 gradlew 可执行
        run: chmod +x gradlew

      # ★ 与 ios-compile 同款安装方式（brew 优先 + GitHub Releases 二进制兜底）：
      #   brew 依赖 Homebrew 索引状态，偶尔卡住；**不能因为装不上就跳过**——
      #   跳过就等于没出包。所以必须留兜底路径。
      - name: 安装 XcodeGen
        run: |
          set -uo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then
            if brew install xcodegen; then
              echo "brew 安装成功"
            else
              echo "::warning::brew install xcodegen 失败 → 回退到 GitHub Releases 的官方二进制"
              ZIP_URL="$(curl -fsSL https://api.github.com/repos/yonaskolb/XcodeGen/releases/latest \
                | grep -o 'https://[^"]*xcodegen\.zip' | head -1)"
              [ -n "${ZIP_URL}" ] || { echo "::error::拿不到 XcodeGen 的下载地址"; exit 1; }
              echo "下载：${ZIP_URL}"
              curl -fsSL -o /tmp/xcodegen.zip "${ZIP_URL}"
              rm -rf /tmp/xcodegen && mkdir -p /tmp/xcodegen
              unzip -q /tmp/xcodegen.zip -d /tmp/xcodegen
              sudo install -m 0755 /tmp/xcodegen/bin/xcodegen /usr/local/bin/xcodegen
            fi
          fi
          xcodegen --version
          VER="$(xcodegen --version | grep -oE '[0-9]+\.[0-9]+' | head -1)"
          MAJ="${VER%%.*}"
          MIN="$(printf '%s' "${VER}" | cut -d. -f2)"
          if [ -z "${MAJ}" ] || [ -z "${MIN}" ] || [ "${MAJ}" -lt 2 ] || { [ "${MAJ}" -eq 2 ] && [ "${MIN}" -lt 45 ]; }; then
            echo "::error::XcodeGen 版本过低（${VER:-未知}）—— projectFormat 选项需要 >= 2.45"
            exit 1
          fi
          echo "XcodeGen 版本 OK：${VER}"

      - name: 记录 Xcode / SDK 版本
        run: |
          set -euo pipefail
          xcodebuild -version
          xcode-select -p
          xcodebuild -showsdks | grep -i iphoneos || true

      - name: 生成 Xcode 工程（xcodegen generate）
        run: |
          set -euo pipefail
          xcodegen generate --spec ios/project.yml --project ios
          test -d ios/ShotTuner.xcodeproj || { echo "::error::xcodegen 没有生成 .xcodeproj"; exit 1; }
          echo "::notice::xcodegen generate 完成"

      # ── 归档：真机（iphoneos）目标，且**绝不签名** ──
      #
      # ★ 为什么用 generic/platform=iOS：
      #   它选的是 **iphoneos SDK** → ARCHS=arm64（真机架构）。
      #   ios-compile 用的是 generic/platform=iOS Simulator → arm64 模拟器切片，
      #   那个产物**装不到 iPhone 上**。两者产物不同，不能互相顶替。
      #
      # ★ 签名三个开关必须显式关掉：
      #   CODE_SIGNING_ALLOWED=NO → 不做签名
      #   CODE_SIGNING_REQUIRED=NO → 不要求签名
      #   CODE_SIGN_IDENTITY=""    → 不选任何证书
      #   （project.yml 里已经写死了这三项，这里再显式给一遍是**双保险**：
      #     万一将来 project.yml 被人改了，这条命令行参数仍然拦得住。）
      - name: 归档（xcodebuild archive · 真机 iphoneos · 不签名）
        run: |
          set -euo pipefail
          ARCHIVE="${RUNNER_TEMP}/ShotTuner.xcarchive"
          rm -rf "${ARCHIVE}"
          # ★ 用 { } 包起来再重定向：这样 CODE_SIGN_IDENTITY="" 那一行**后面什么都不跟**。
          #   G1-d 凭据门禁按「行首变量名 + 赋值 + 非空值」扫描全仓库，
          #   那一行后面若跟了 ` 2>&1 | tee ...`，整个管道会被当成变量值 → 门禁误报。
          {
            xcodebuild archive \
              -project ios/ShotTuner.xcodeproj \
              -scheme ShotTuner \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -archivePath "${ARCHIVE}" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY=""
          } 2>&1 | tee /tmp/archive.log
          # ★ 反「什么都没编」断言：
          #   xcodebuild 退出码为 0 也可能一个源文件都没编（工程生成坏了 / 目标选错）。
          #   只信自己写的断言，不信退出码。
          grep -q "ARCHIVE SUCCEEDED" /tmp/archive.log \
            || { echo "::error::xcodebuild 没有 ARCHIVE SUCCEEDED"; exit 1; }
          grep -q "KMP_FRAMEWORK_READY=1" /tmp/archive.log \
            || { echo "::error::KMP 共享内核的 framework 没有产出 —— Run Script 没跑或跑失败了"; exit 1; }
          test -d "${ARCHIVE}/Products/Applications/ShotTuner.app" \
            || { echo "::error::归档里没有 Products/Applications/ShotTuner.app"; exit 1; }
          echo "::notice::归档完成"
          ls -la "${ARCHIVE}/Products/Applications/ShotTuner.app"

      # ── 出 ipa：路线 A（exportArchive）→ 失败回退路线 B（直接打 zip）──────
      #
      # ★ 两条路线都留着，因为**未签名导出在某些 Xcode 版本上会直接失败**：
      #   报错形如 "requires a provisioning profile"——
      #   而我们**不能**去申请证书（硬规则一），所以必须有不需要 exportArchive 的兜底。
      #
      # ★ 路线 B 为什么合法：
      #   **ipa 本质上就是个 zip**，顶层是 `Payload/ShotTuner.app`。
      #   SideStore 接受这种未签名 ipa —— 它本来就是干这个的（替用户重签）。
      - name: 出 ipa（路线 A：exportArchive → 失败回退路线 B：直接打 zip）
        run: |
          set -uo pipefail
          ARCHIVE="${RUNNER_TEMP}/ShotTuner.xcarchive"
          OUTDIR="${RUNNER_TEMP}/ipa-out"
          EXPORT_DIR="${RUNNER_TEMP}/export"
          VERSION="$(grep -E "^[[:space:]]*MARKETING_VERSION[[:space:]]*:" ios/project.yml | head -1 \
            | sed -E 's/.*:[[:space:]]*//' | tr -d '"' | tr -d '[:space:]')"
          ASSET_NAME="ShotTuner-${VERSION}-unsigned.ipa"
          echo "版本号（取自 ios/project.yml）：${VERSION}"
          echo "产物名：${ASSET_NAME}"
          [ -n "${VERSION}" ] || { echo "::error::从 ios/project.yml 里读不出 MARKETING_VERSION"; exit 1; }

          rm -rf "${OUTDIR}" "${EXPORT_DIR}"
          mkdir -p "${OUTDIR}" "${EXPORT_DIR}"

          # ── 路线 A：xcodebuild -exportArchive（标准做法）──
          echo "▶ 路线 A：xcodebuild -exportArchive（未签名导出）"
          set +e
          xcodebuild -exportArchive \
            -archivePath "${ARCHIVE}" \
            -exportPath "${EXPORT_DIR}" \
            -exportOptionsPlist ios/ExportOptions.plist \
            2>&1 | tee /tmp/export-a.log
          RC_A="${PIPESTATUS[0]}"
          set -e
          echo "路线 A 退出码：${RC_A}"
          ROUTE="none"
          if [ "${RC_A}" -eq 0 ]; then
            A_IPA="$(find "${EXPORT_DIR}" -name '*.ipa' -type f 2>/dev/null | head -1)"
            if [ -n "${A_IPA}" ] && [ -s "${A_IPA}" ]; then
              cp "${A_IPA}" "${OUTDIR}/${ASSET_NAME}"
              ROUTE="A"
              echo "::notice::路线 A 成功：${A_IPA}"
            else
              echo "::warning::路线 A 退出码为 0，但导出目录里没有 ipa —— 按失败处理"
            fi
          else
            echo "::warning::路线 A 失败（退出码 ${RC_A}）—— 报错原文："
            grep -iE "error|requires|provisioning|certificate|signing" /tmp/export-a.log | head -30 || true
          fi

          # ── 路线 B：直接从 .xcarchive 取 .app 打成 ipa ──
          if [ "${ROUTE}" != "A" ]; then
            echo "▶ 路线 B：直接取 .app 打 ipa（ipa = 顶层含 Payload/ 的 zip）"
            APP="${ARCHIVE}/Products/Applications/ShotTuner.app"
            if [ ! -d "${APP}" ]; then
              APP="$(find "${ARCHIVE}/Products" -type d -name 'ShotTuner.app' 2>/dev/null | head -1)"
            fi
            [ -n "${APP}" ] && [ -d "${APP}" ] \
              || { echo "::error::归档里找不到 ShotTuner.app"; exit 1; }
            STAGE="${RUNNER_TEMP}/ipa-stage"
            rm -rf "${STAGE}"
            mkdir -p "${STAGE}/Payload"
            cp -R "${APP}" "${STAGE}/Payload/"
            ( cd "${STAGE}" && ditto -c -k --sequesterRsrc --keepParent Payload "${OUTDIR}/${ASSET_NAME}" )
            ROUTE="B"
            echo "::notice::路线 B 成功：${STAGE}/Payload/ShotTuner.app → ${OUTDIR}/${ASSET_NAME}"
          fi

          echo "::notice::最终出包路线：${ROUTE}"
          ls -la "${OUTDIR}"
          test -s "${OUTDIR}/${ASSET_NAME}" \
            || { echo "::error::ipa 不存在或为空：${OUTDIR}/${ASSET_NAME}"; exit 1; }

      # ── ★ 反假绿断言（**最重要的一步**）────────────────────────────────
      #
      # ★ 为什么不能只看 job 变绿：
      #   我们在这个项目上已经栽过一次 —— Gradle 的 **SKIPPED 任务，
      #   GitHub 上显示的 conclusion 也是 `success`**，
      #   差点把「iOS 编译在 Linux 上是 SKIPPED」误判成「通过了」。
      #   ⇒ **只信自己写的断言，不要信 xcodebuild 的退出码。**
      #
      # ★ 五条断言（缺一条都算假绿）：
      #   ① ipa 存在且非空
      #   ② ipa 里真的有 Payload/ShotTuner.app，且不是空壳（有可执行文件）
      #   ③ 可执行文件是**真机**架构（arm64 + platform IOS），**不是**模拟器
      #   ④ Shared.framework 在里面，且**也有 arm64 真机切片**（少了它真机直接崩）
      #   ⑤ Info.plist 的 CFBundleIdentifier / CFBundleShortVersionString / CFBundleVersion 对不对
      #
      # ★ 所有断言跑完再统一判红 —— 一次 macOS 运行把全部信息拿全，
      #   不要「第一条失败就退出」，否则每次重跑只多知道一件事。
      - name: 反假绿断言（ipa 结构 / 真机架构 / framework / 版本号）
        run: |
          set -uo pipefail
          OUTDIR="${RUNNER_TEMP}/ipa-out"
          VERIFY="${RUNNER_TEMP}/verify"
          VERSION="$(grep -E "^[[:space:]]*MARKETING_VERSION[[:space:]]*:" ios/project.yml | head -1 \
            | sed -E 's/.*:[[:space:]]*//' | tr -d '"' | tr -d '[:space:]')"
          ASSET_NAME="ShotTuner-${VERSION}-unsigned.ipa"
          IPA="${OUTDIR}/${ASSET_NAME}"
          FAILURES=0
          fail() { echo "::error::断言失败 · ${1}"; FAILURES=$((FAILURES + 1)); }

          # ── ① ipa 存在且非空 ──
          if [ -s "${IPA}" ]; then
            echo "[断言1] OK —— ipa 存在且非空：${IPA}（$(wc -c < "${IPA}" | tr -d ' ') 字节）"
          else
            fail "[断言1] ipa 不存在或为空：${IPA}"
          fi

          # ── 解包（后面每条断言都基于解包后的真实内容）──
          rm -rf "${VERIFY}"
          mkdir -p "${VERIFY}"
          unzip -q "${IPA}" -d "${VERIFY}" 2>/dev/null || fail "[断言2] ipa 解包失败"
          echo "--- ipa 顶层结构 ---"
          ls -la "${VERIFY}"
          APP="${VERIFY}/Payload/ShotTuner.app"
          EXEC="${APP}/ShotTuner"

          # ── ② 顶层是 Payload/ShotTuner.app，且不是空壳 ──
          if [ -d "${APP}" ]; then
            echo "[断言2] OK —— ipa 里有 Payload/ShotTuner.app"
            echo "--- Payload/ShotTuner.app 目录树（两层）---"
            find "${APP}" -maxdepth 2 2>/dev/null | sed "s|${VERIFY}/||" | sort
          else
            fail "[断言2] ipa 里没有 Payload/ShotTuner.app —— 顶层结构是：$(ls "${VERIFY}" 2>/dev/null | tr '\n' ' ')"
          fi
          if [ -f "${EXEC}" ] && [ -s "${EXEC}" ]; then
            echo "[断言2b] OK —— 可执行文件存在且非空（$(wc -c < "${EXEC}" | tr -d ' ') 字节）"
          else
            fail "[断言2b] Payload/ShotTuner.app 里没有可执行文件 ShotTuner —— 这是个空壳"
          fi

          # ── ③ 架构：必须是**真机** arm64，不能是模拟器 ──
          #   判据不是 `file` 的输出（模拟器也是 arm64），而是 Mach-O 里的
          #   LC_BUILD_VERSION 的 platform 字段（**数字**）：2 = IOS 真机，7 = IOSSIMULATOR 模拟器。
          if [ -f "${EXEC}" ]; then
            echo "--- file 可执行文件 ---"
            file "${EXEC}"
            echo "--- lipo -archs 可执行文件 ---"
            ARCHS="$(lipo -archs "${EXEC}" 2>/dev/null || true)"
            echo "${ARCHS}"
            echo "--- otool LC_BUILD_VERSION（真机/模拟器判据）---"
            otool -l "${EXEC}" 2>/dev/null | grep -A4 'LC_BUILD_VERSION' || true
            # ★★ otool -l 的 LC_BUILD_VERSION 里 platform 是**数字**，不是字符串：
            #   1=MACOS  2=IOS(真机)  3=TVOS  4=WATCHOS  6=MACCATALYST
            #   7=IOSSIMULATOR(模拟器)  8=TVOS_SIMULATOR  11=VISIONOS
            # ★ 第一版按字符串 IOS / IOSSIMULATOR 匹配 → **永远匹配不上**
            #   （实测打印出来是 "platform 2,"），于是把**真机产物**误判成
            #   「判定不了真机/模拟器」。**产物本身是对的，是判据写错了。**
            PLATFORM_NUM="$(otool -l "${EXEC}" 2>/dev/null | grep -E '^[[:space:]]+platform[[:space:]]+'\
              | tr -s ' ' | grep -oE '[0-9]+' | sort -u | tr '\n' ',')"
            echo "platform 编号：${PLATFORM_NUM}（2=iOS 真机 / 7=iOS 模拟器）"
            case "${PLATFORM_NUM}" in
              *7*) fail "[断言3] 可执行文件是**模拟器**切片（platform 7）—— 装不到 iPhone 上" ;;
              *2*) echo "[断言3] OK —— 可执行文件是**真机**切片（platform 2）" ;;
              *)   fail "[断言3] 读不出 platform 编号（实际：${PLATFORM_NUM}）—— 判定不了真机/模拟器" ;;
            esac
            case "${ARCHS}" in
              *arm64*) echo "[断言3b] OK —— 架构含 arm64" ;;
              *)       fail "[断言3b] 架构里没有 arm64：${ARCHS}" ;;
            esac
            case "${ARCHS}" in
              *x86_64*) fail "[断言3c] 架构里出现了 x86_64（模拟器架构）—— 这不是纯真机产物" ;;
              *)        echo "[断言3c] OK —— 架构里没有 x86_64" ;;
            esac
          fi

          # ── ④ Shared.framework 在里面，且也有 arm64 真机切片 ──
          #   动态 framework 少了它（或带了模拟器切片），真机装上去直接
          #   「Library not loaded」—— 这是整个出包链路最容易翻车的地方。
          FW="${APP}/Frameworks/Shared.framework"
          if [ -d "${FW}" ]; then
            echo "[断言4] OK —— Frameworks/Shared.framework 存在"
            echo "--- Shared.framework 内容 ---"
            ls -la "${FW}"
            if [ -f "${FW}/Shared" ]; then
              FW_ARCHS="$(lipo -archs "${FW}/Shared" 2>/dev/null || true)"
              FW_PLATFORM="$(otool -l "${FW}/Shared" 2>/dev/null | grep -E '^[[:space:]]+platform[[:space:]]+' \
                | tr -s ' ' | grep -oE '[0-9]+' | sort -u | tr '\n' ',')"
              echo "Shared.framework 架构：${FW_ARCHS}"
              echo "Shared.framework platform：${FW_PLATFORM}"
              case "${FW_ARCHS}" in
                *arm64*) echo "[断言4b] OK —— Shared.framework 含 arm64 切片" ;;
                *)       fail "[断言4b] Shared.framework 没有 arm64 切片：${FW_ARCHS}" ;;
              esac
              case "${FW_PLATFORM}" in
                *7*)             fail "[断言4c] Shared.framework 是**模拟器**切片（platform 7）—— 真机会崩" ;;
                *2*)             echo "[断言4c] OK —— Shared.framework 是**真机**切片" ;;
                *)              fail "[断言4c] 读不出 Shared.framework 的 platform 编号：${FW_PLATFORM}" ;;
              esac
            else
              fail "[断言4] Shared.framework 里没有可执行文件 Shared —— 空壳"
            fi
          else
            fail "[断言4] 产物里没有 Frameworks/Shared.framework —— 真机装上去会直接崩"
          fi

          # ── ⑤ Info.plist 的三个关键字段 ──
          PLIST="${APP}/Info.plist"
          if [ -f "${PLIST}" ]; then
            echo "--- Info.plist（plutil -p）---"
            plutil -p "${PLIST}" 2>/dev/null || echo "(plutil 读取失败)"
            read_plist() {
              plutil -extract "${1}" raw -o - "${PLIST}" 2>/dev/null \
                || /usr/libexec/PlistBuddy -c "Print :${1}" "${PLIST}" 2>/dev/null \
                || echo "<读取失败>"
            }
            BID="$(read_plist CFBundleIdentifier)"
            SHV="$(read_plist CFBundleShortVersionString)"
            BVN="$(read_plist CFBundleVersion)"
            echo "CFBundleIdentifier        = ${BID}"
            echo "CFBundleShortVersionString = ${SHV}"
            echo "CFBundleVersion           = ${BVN}"
            # 期望值从 ios/project.yml 取（单一事实来源），不另写一份常量。
            EXPECT_SHV="$(grep -E "^[[:space:]]*MARKETING_VERSION[[:space:]]*:" ios/project.yml | head -1 \
              | sed -E 's/.*:[[:space:]]*//' | tr -d '"' | tr -d '[:space:]')"
            EXPECT_BVN="$(grep -E "^[[:space:]]*CURRENT_PROJECT_VERSION[[:space:]]*:" ios/project.yml | head -1 \
              | sed -E 's/.*:[[:space:]]*//' | tr -d '"' | tr -d '[:space:]')"
            EXPECT_BID="$(awk '
              /^[[:space:]]*Release:[[:space:]]*$/ { inrel = 1; next }
              /^[[:space:]]*Debug:[[:space:]]*$/   { inrel = 0; next }
              inrel && /PRODUCT_BUNDLE_IDENTIFIER/ {
                sub(/^[^:]*:[[:space:]]*/, ""); gsub(/"/, ""); print; exit
              }
            ' ios/project.yml)"
            echo "期望（来自 ios/project.yml）：id=${EXPECT_BID} version=${EXPECT_SHV} build=${EXPECT_BVN}"
            [ "${BID}" = "${EXPECT_BID}" ] \
              && echo "[断言5] OK —— CFBundleIdentifier = ${BID}" \
              || fail "[断言5] CFBundleIdentifier 不对：期望 ${EXPECT_BID}，实际 ${BID}"
            [ "${SHV}" = "${EXPECT_SHV}" ] \
              && echo "[断言5b] OK —— CFBundleShortVersionString = ${SHV}" \
              || fail "[断言5b] CFBundleShortVersionString 不对：期望 ${EXPECT_SHV}，实际 ${SHV}"
            [ "${BVN}" = "${EXPECT_BVN}" ] \
              && echo "[断言5c] OK —— CFBundleVersion = ${BVN}" \
              || fail "[断言5c] CFBundleVersion 不对：期望 ${EXPECT_BVN}，实际 ${BVN}"
          else
            fail "[断言5] 产物里没有 Info.plist"
          fi

          # ── 附：签名状态（硬规则一：CI 一律不签名）──
          #   「完全未签名」= 最好；「ad-hoc」= 只是占位签名，SideStore 重签会覆盖；
          #   带真实身份 = 违反硬规则一，必须红。
          if [ -f "${EXEC}" ]; then
            SIGN_INFO="$(codesign -dv --verbose=4 "${EXEC}" 2>&1 || true)"
            echo "--- codesign -dv --verbose=4（可执行文件）---"
            echo "${SIGN_INFO}" | head -20
            if echo "${SIGN_INFO}" | grep -q "not signed at all"; then
              echo "[附] OK —— 可执行文件**完全未签名**（code object is not signed at all）"
            elif echo "${SIGN_INFO}" | grep -qi "adhoc"; then
              echo "::warning::[附] 可执行文件是 **ad-hoc 签名**（不是真签名）—— SideStore 重签会覆盖，但已不是纯粹未签名产物"
            elif echo "${SIGN_INFO}" | grep -qiE '^Authority=|^TeamIdentifier='; then
              fail "[附] 产物带**真实签名身份** —— 违反硬规则一（CI 一律不签名）"
            else
              echo "::warning::[附] 读不出签名状态：${SIGN_INFO}"
            fi
          fi

          echo "=================================================="
          if [ "${FAILURES}" -gt 0 ]; then
            echo "::error::反假绿断言失败：${FAILURES} 条不通过 —— **这个包不能上传**"
            exit 1
          fi
          echo "::notice::反假绿断言全部通过（5 组断言 + 附带的签名状态检查）"

      # ── 把 ipa 留一份 workflow artifact（Release 上传失败时的备份，
      #    也方便本地下载后独立复核一遍）──
      - name: 留档（workflow artifact）
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: ${{ runner.temp }}/ipa-out/*.ipa
          if-no-files-found: error
          retention-days: 30

      # ── 上传到 Release（与 Android 的 apk 同一个 Release）──
      #
      # ★ 上传 asset 必须用 release 对象的 **upload_url**（形如
      #   https://uploads.github.com/repos/.../releases/{id}/assets{?name,label}）——
      #   用 html_url 或 /releases/{id}/assets 都是 **404**。
      #   要把 URL 末尾的 `{?name,label}` 模板串**截掉**再拼 `?name=`。
      #
      # ★ token 不进命令行（会被 ps 看到）：用 curl --config - 从 stdin / fd 读 header。
      #   printf 是 bash 内建命令，不会 fork 出进程，所以 token 不会出现在进程表里。
      - name: 上传 ipa 到 Release（v1.0.0）
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          OUTDIR="${RUNNER_TEMP}/ipa-out"
          VERSION="$(grep -E "^[[:space:]]*MARKETING_VERSION[[:space:]]*:" ios/project.yml | head -1 \
            | sed -E 's/.*:[[:space:]]*//' | tr -d '"' | tr -d '[:space:]')"
          ASSET_NAME="ShotTuner-${VERSION}-unsigned.ipa"
          IPA="${OUTDIR}/${ASSET_NAME}"
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          AUTH_CFG() {
            printf 'header = "Authorization: Bearer %s"\nheader = "Accept: application/vnd.github+json"\n' "${GITHUB_TOKEN}"
          }
          echo "▶ 取 Release（tag=${RELEASE_TAG}）的 upload_url"
          # ★ 用 /releases/tags/<tag> 端点：返回的就是完整 release 对象
          #   （含 upload_url 与 assets），与 /releases/<id> 等价，但不用维护 id。
          REL_JSON="$(curl -fsSL --config <(AUTH_CFG) "${API}/releases/tags/${RELEASE_TAG}")"
          UPLOAD_URL="$(printf '%s' "${REL_JSON}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["upload_url"])')"
          # ★ 截掉 URL 末尾的 {?name,label} 模板串 —— 带上去会 404。
          UPLOAD_URL="${UPLOAD_URL%%\{*}"
          echo "upload_url（已截模板串）：${UPLOAD_URL}"

          # 重跑时 GitHub 不允许同名 asset → 先删掉旧的。
          # ★ python 代码必须写成**单行**：多行的话，YAML 块标量的缩进基准会被打乱
          #   （块内某一行顶格 → YAML 认为块结束了 → 整份 workflow 解析失败）。
          EXIST_ID="$(printf '%s' "${REL_JSON}" | python3 -c 'import json,sys; d=json.load(sys.stdin); n=sys.argv[1]; print(next((a["id"] for a in d.get("assets",[]) if a.get("name")==n), ""))' "${ASSET_NAME}")"
          if [ -n "${EXIST_ID}" ]; then
            echo ">> 已存在同名 asset（id=${EXIST_ID}）→ 先删除"
            curl -fsSL -X DELETE --config <(AUTH_CFG) "${API}/releases/assets/${EXIST_ID}"
          fi

          echo ">> 上传 ${ASSET_NAME}"
          HTTP_CODE="$(curl -sS -o /tmp/upload.out -w '%{http_code}' -X POST \
            --config <(printf 'header = "Authorization: Bearer %s"\nheader = "Accept: application/vnd.github+json"\nheader = "Content-Type: application/octet-stream"\n' "${GITHUB_TOKEN}") \
            --data-binary "@${IPA}" \
            "${UPLOAD_URL}?name=${ASSET_NAME}")"
          cat /tmp/upload.out
          echo
          [ "${HTTP_CODE}" = "201" ] \
            || { echo "::error::上传失败，HTTP ${HTTP_CODE}"; exit 1; }
          echo "::notice::ipa 已挂到 Release（${ASSET_NAME}）"
