# ⚠️ 硬规则一：CI 一律不签名 —— 签名在设备端用 SideStore 侧载时完成。
# ⚠️ 硬规则二：Apple ID / 证书 / provisioning profile 绝不进本仓库的 secrets，也绝不入库。
# ⚠️ 硬规则三：若将来 CI 要直出可安装包，必须用 App Store Connect API Key，
#              不得使用 `-allowProvisioningUpdates` 搭配 Apple ID —— 出现该配置评审直接打回。
#
# 为什么这三条要写成注释而不是只写进文档：
#   凭据一旦入库，CI 才有能力用它。README 里写"不进 secrets"只是**承诺**，
#   承诺会被人绕过，机器不会。真正的保障是 tools/ci/check-apple-credentials.sh。
name: ci-gates

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  gates:
    name: 零网络 / 凭据 / 门禁自检
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 门禁自己先被测一遍：注入「应该绿」的东西必须绿，注入「应该红」的东西必须红。
      # 这一步放在最前面 —— 它抓到过 common.sh 里一个让门禁永远绿的 bug。
      - name: 门禁反向验证
        run: bash tools/ci/test-gates.sh

      - name: L1 源码层零网络
        run: bash tools/ci/check-no-network.sh

      - name: L2 配置层零网络
        run: bash tools/ci/check-no-network-config.sh

      - name: G1-d Apple 凭据门禁
        run: bash tools/ci/check-apple-credentials.sh

      # commonMain 纯度扫描（秒级）：Android 编译看不出来、iOS 上会挂的 JVM-only 用法。
      # 权威检查是 common-gate 里的 compileCommonMainKotlinMetadata；这一道是快速反馈。
      - name: commonMain 纯度扫描
        run: bash tools/ci/check-common-purity.sh

      # iOS 工程规格自检：project.yml / Info.plist 是纯文本，
      # 没有 Mac 也能改 —— 所以必须有机器替人盯着那些硬规则
      # （部署目标、签名开关、零第三方依赖、ATS 不放宽、权限清单、只有一个 target）。
      # 只需要读文本，Linux runner 就够，不占 macOS 配额。
      - name: iOS 工程规格自检
        run: bash tools/ci/check-ios-project-spec.sh

  # ── common-gate：commonMain 能编 iOS target 吗？（整份 CI 设计的单点依赖）──
  #
  # ★ 为什么跑在 Linux runner 上：
  #   免费私有仓库的 macOS 配额只有约 200 分钟/月，而 macOS 是 10× 倍率。
  #   所以 Linux 这一档只做**不依赖 Apple 工具链**的事：
  #   ① common 源集的 metadata 编译（验证「只用了 common API」）
  #   ② commonTest + Android 单测
  #   ③ Android 侧编译
  #
  # ★ 2026-10-27 实测结论（架构侧「悬置项 S1」已翻盘）：
  #   `:shared:compileKotlinIosSimulatorArm64` 在 **Linux runner 上是 SKIPPED** ——
  #   Kotlin/Native 的硬宿主限制：**Apple 目标只能从 macOS 宿主编译**。
  #   ⚠️ Gradle 的 SKIPPED 任务，GitHub 上显示的 conclusion 也是 success！
  #      只看结论会误判成「通过」—— 必须去日志里确认任务不是 SKIPPED。
  #   所以 iOS 编译挪到下面的 `ios-compile` job（macOS，手动触发）。
  #
  # ★ `-PenableAppleTargets=true`：
  #   Apple 目标默认关闭（否则 Windows 开发者改一行 commonMain 也得下载
  #   几百 MB 的 Kotlin/Native 预编译，而那个包在 Windows 上根本用不上）。
  common-gate:
    name: commonMain 编译 + 单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # ★ gradlew 的可执行位：Windows 上 git 的 core.fileMode 默认 false，
      #   本地文件看着有执行位，但**提交进仓库的模式可能是 644** ——
      #   checkout 到 Linux runner 上就没有执行权限，./gradlew 直接
      #   "Permission denied"（exit 126）。这一步当年就是这么翻车的。
      - name: 准备 gradle.properties
        run: cp gradle.properties.example gradle.properties

      - name: 确保 gradlew 可执行
        run: chmod +x gradlew

      # gradle.properties 被 .gitignore 排除（里面有明文签名口令），
      # 但其中的构建必需项（android.useAndroidX 等）CI 也要用 ——
      # 所以从 example 复制一份。example 里的 RELEASE_* 是空的，
      # 而签名配置已改成惰性求值（app/build.gradle.kts），
      # 所以**门禁与 debug 构建都不需要凭据**，只有 assembleRelease 才需要。
      # ── 1. common 源集的 metadata 编译：验证「只用了 common API」──
      #   这是 Linux 上能做的「iOS 纯度」代理检查：
      #   metadata 编译只允许 common API。若 commonMain 里用了
      #   Android/JVM-only 的东西（如 java.lang.Math、java.text.SimpleDateFormat），
      #   这里会报错 —— 而 **Android 侧编译看不出来**（Android 有这些类）。
      #   ★ 跑完必须确认这行**不是 SKIPPED**（多目标配置下才有意义），
      #     所以下面显式做了一次反 SKIPPED 断言。
      - name: 编译 common 源集 metadata
        run: |
          set -o pipefail
          ./gradlew :shared:compileCommonMainKotlinMetadata -PenableAppleTargets=true --console=plain 2>&1 | tee /tmp/meta.log
          if grep -q "compileCommonMainKotlinMetadata SKIPPED" /tmp/meta.log; then
            echo "::error::common metadata 编译被 SKIPPED —— 这一档没有真的在验证 common 纯度"
            exit 1
          fi

      # ── 2. commonTest + Android 单测（JVM 上跑，不需要 macOS）──
      - name: 单元测试
        run: ./gradlew :shared:testDebugUnitTest :app:testDebugUnitTest

      # ── 3. Android 侧零行为变化 ──
      - name: 编译 Android
        run: ./gradlew :app:assembleDebug

  # ── ios-compile：真正把 iOS target 编出来（**必须 macOS 宿主**）────────
  #
  # ★ 为什么单独一个 job 且**手动触发**：
  #   Kotlin/Native 的硬宿主限制 —— Apple 目标只能从 macOS 宿主编译，
  #   在 Linux 上该任务是 SKIPPED（实测 2026-10-27）。
  #   而免费私有仓库的 macOS 配额只有约 200 分钟/月（10× 倍率后约 20 次热构建），
  #   **不能每次 push 都烧**。所以改成 workflow_dispatch 手动触发：
  #   攒一批改动再编一次，而不是改一行编一次。
  #
  # ★ 关键：SideStore 的 7 天重签**不需要重新编译** —— 重签的是同一个 ipa。
  #   所以 macOS 配额只花在「代码变更后的重新编译」上，不花在 7 天重签上。
  #
  # ★ 这个 job 跑的是「模拟器」target（iosSimulatorArm64），
  #   它验证的是**源码能在 iOS 侧编译**；真机产物（iosArm64 + framework 链接）
  #   由 G4 出包 job 在 macOS 上做。
  ios-compile:
    name: iOS target 编译（macOS · 手动触发）
    # ★ 为什么不用 macos-latest：
    #   实测 2026-10-27，免费私有仓库的 macOS runner **排队 15 分钟就被自动取消**
    #   （GitHub 在分配不到 runner 时会 cancel 并报 failure）。
    #   较老的 runner 版本供给更多、排队更短，所以固定用 macos-14。
    #   排队被取消**不消耗 macOS 配额**（没跑就不计时），所以多试几个标签是安全的。
    runs-on: macos-14
    # 排队 + 编译的总时限；超了就明确失败，别让人以为跑过
    timeout-minutes: 45
    # 只手动触发 + 允许手动跑分档；不做 push 触发 —— 保护 macOS 配额
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: 准备 gradle.properties
        run: cp gradle.properties.example gradle.properties

      - name: 确保 gradlew 可执行
        run: chmod +x gradlew

      - name: 编译 iOS target（模拟器 + 真机）
        run: |
          set -o pipefail
          ./gradlew :shared:compileKotlinIosSimulatorArm64 :shared:compileKotlinIosArm64             -PenableAppleTargets=true --console=plain 2>&1 | tee /tmp/ios.log
          # ★ 反 SKIPPED 断言：在 macOS 上如果还是 SKIPPED，说明开关没生效 ——
          #   那就等于什么都没验，必须让它红。
          if grep -qE "compileKotlinIos(Simulator)?Arm64 SKIPPED" /tmp/ios.log; then
            echo "::error::iOS 编译被 SKIPPED —— 什么都没验，必须让它红"
            exit 1
          fi

      # ── T10：真正把 iOS 工程编出来（xcodegen generate + xcodebuild）──
      #
      # ★ 为什么必须有这一步：
      #   上面那个 gradle 步骤只证明「Kotlin 侧能编出 iOS 的 klib」，
      #   **完全没有验证 Xcode 工程本身**（SwiftUI 代码能不能编、
      #   project.yml 能不能生成出工程、共享内核的 framework 能不能链上）。
      #   ios/project.yml + ios/ShotTuner/**.swift 是纯文本，Windows 上也能改 ——
      #   那就更需要一个机器来兜底，否则「改了但编不过」会一路漏到出包那一步。
      #
      # ★ 为什么装 XcodeGen 用「brew 优先 + release 二进制兜底」：
      #   brew 装 XcodeGen 一般只要几十秒，但它依赖 Homebrew 的索引状态，
      #   偶尔会卡住或限流。**不能因为装不上就跳过这一步** —— 跳过就等于没验。
      #   所以兜底路径是：从 GitHub Releases 直接拉官方 zip（几 MB，秒级）。
      - name: 安装 XcodeGen
        run: |
          set -euo pipefail
          if command -v xcodegen >/dev/null 2>&1; then
            echo "runner 已自带 XcodeGen：$(xcodegen --version)"
            exit 0
          fi
          if brew install xcodegen; then
            echo "brew 安装成功：$(xcodegen --version)"
            exit 0
          fi
          echo "::warning::brew install xcodegen 失败 → 回退到 GitHub Releases 的官方二进制"
          ZIP_URL="$(curl -fsSL https://api.github.com/repos/yonaskolb/XcodeGen/releases/latest \
            | grep -o 'https://[^"]*xcodegen\.zip' | head -1)"
          [ -n "$ZIP_URL" ] || { echo "::error::拿不到 XcodeGen 的下载地址"; exit 1; }
          echo "下载：$ZIP_URL"
          curl -fsSL -o /tmp/xcodegen.zip "$ZIP_URL"
          rm -rf /tmp/xcodegen && mkdir -p /tmp/xcodegen
          unzip -q /tmp/xcodegen.zip -d /tmp/xcodegen
          sudo install -m 0755 /tmp/xcodegen/bin/xcodegen /usr/local/bin/xcodegen
          xcodegen --version

      - name: 生成 Xcode 工程（xcodegen generate）
        run: |
          set -euo pipefail
          xcodegen generate --spec ios/project.yml --project ios
          # 反「没真生成」断言：工程目录必须存在
          test -d ios/ShotTuner.xcodeproj || { echo "::error::xcodegen 没有生成 .xcodeproj"; exit 1; }
          echo "::notice::xcodegen generate 完成"

      - name: 编译 iOS App（xcodebuild · 模拟器 · 不签名）
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/ShotTuner.xcodeproj \
            -scheme ShotTuner \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee /tmp/xcodebuild.log
          # ★ 反 SKIPPED / 反「什么都没编」断言：
          #   xcodebuild 成功但一个源文件都没编（工程生成坏了）也等于没验。
          grep -q "KMP_FRAMEWORK_READY=1" /tmp/xcodebuild.log \
            || { echo "::error::KMP 共享内核的 framework 没有产出 —— Run Script 没跑或跑失败了"; exit 1; }
          grep -q "SwiftCompile\|CompileSwiftSources" /tmp/xcodebuild.log \
            || { echo "::error::没有看到 Swift 编译记录 —— 工程可能没真正编译"; exit 1; }
          grep -q "BUILD SUCCEEDED" /tmp/xcodebuild.log \
            || { echo "::error::xcodebuild 没有 BUILD SUCCEEDED"; exit 1; }
          echo "::notice::xcodebuild 编译通过"

      - name: 产物留档（.app 目录清单）
        run: |
          set -euo pipefail
          APP=$(find ios/build/DerivedData -maxdepth 5 -name 'ShotTuner.app' -type d | head -1)
          if [ -z "$APP" ]; then
            echo "::error::找不到构建出来的 ShotTuner.app"
            exit 1
          fi
          echo "产物：$APP"
          ls -la "$APP"
          # 共享内核的 framework 必须被嵌进去（动态 framework 少了它，真机装上去会崩）
          test -d "$APP/Frameworks/Shared.framework" \
            || { echo "::error::产物里没有 Frameworks/Shared.framework"; exit 1; }
